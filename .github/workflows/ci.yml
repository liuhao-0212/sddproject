# =============================================================================
# CI：持续集成 —— 每次 PR / 合入 main 都跑，回答"这次改动能不能进主干"
#
# 设计原则：
#   1) 快：规范检查、环境自检、静态检查都是秒级，放最前面（左移）；
#   2) 全：测试矩阵覆盖 3.11 与 3.13，专门用来抓"版本漂移"这类问题；
#   3) 证据：每一步都产出可下载的制品 / 报告，而不是只看一个红绿点；
#   4) 可复现：构建阶段连续构建两次并比对 sha256。
# =============================================================================
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的新提交会取消旧的一次运行：省额度、少等待
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # 1) 规范完整性（SDD）：代码改动必须能追溯到 specs/
  # ---------------------------------------------------------------------------
  spec:
    name: 规范完整性（SDD）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 需要历史才能做 diff
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 计算对比基准
        id: base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi
      - name: 规范检查（三件套 + 范围边界 + 代码/规范同步）
        run: python pipeline/tools/spec_check.py --project . --base-ref "${{ steps.base.outputs.ref }}"

  # ---------------------------------------------------------------------------
  # 2) 环境自检：把"玄学失败"变成一句人话
  # ---------------------------------------------------------------------------
  env-check:
    name: 环境与依赖自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 安装锁定依赖
        run: uv sync --frozen
      - name: 自检（解释器版本 / 依赖 / 配置）
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          printf '%s' "$CONFIG_YAML" > config.yaml
          uv run python pipeline/tools/env_check.py --project .

  # ---------------------------------------------------------------------------
  # 3) 静态检查（报告级；清零后去掉 --report-only 即可升级为阻断）
  # ---------------------------------------------------------------------------
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 代码健康度报告
        run: python pipeline/tools/lint_check.py --project . --report-only --json-out lint-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 4) 测试：矩阵覆盖最低支持版本与最新版本
  # ---------------------------------------------------------------------------
  test:
    name: 测试（Python ${{ matrix.python }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # 一个版本挂了，另一个继续跑完，信息更完整
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 安装锁定依赖
        run: uv sync --frozen
      - name: 单元 + 集成测试
        run: uv run pytest tests -q --basetemp=.pytest-tmp -rf
      - name: 失败时保留 pytest 临时目录
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-tmp-${{ matrix.python }}
          path: .pytest-tmp
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 5) 安全门禁：依赖漏洞 + 密钥泄漏
  # ---------------------------------------------------------------------------
  security:
    name: 安全门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 依赖漏洞扫描（读 uv.lock）
        run: python pipeline/tools/dep_scan.py --project . --json-out dep-report.json
      - name: 密钥与配置卫生扫描
        run: python pipeline/tools/secret_scan.py --project . --json-out secret-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            dep-report.json
            secret-report.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 6) 构建：产出唯一制品，并验证"可复现"
  # ---------------------------------------------------------------------------
  build:
    name: 构建制品
    runs-on: ubuntu-latest
    needs: [spec, env-check, lint, test, security]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 构建
        run: python pipeline/tools/build_artifact.py --project . --out dist
      - name: 验证可复现（同一次提交构建两次，sha256 必须一致）
        shell: bash
        run: |
          first=$(python -c "import json;print(json.load(open('dist/build-info.json'))['artifact_sha256'])")
          python pipeline/tools/build_artifact.py --project . --out dist > /dev/null
          second=$(python -c "import json;print(json.load(open('dist/build-info.json'))['artifact_sha256'])")
          echo "第一次: $first"
          echo "第二次: $second"
          test "$first" = "$second"
      - name: 写入运行摘要
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          info = json.load(open("dist/build-info.json"))
          print("## 本次构建制品\n")
          print(f"- 版本：`{info['version']}`")
          print(f"- 提交：`{info['git_sha']}`")
          print(f"- 制品 sha256：`{info['artifact_sha256']}`")
          print(f"- 文件数：{info['file_count']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifact
          path: |
            dist/*.zip
            dist/build-info.json
          retention-days: 30