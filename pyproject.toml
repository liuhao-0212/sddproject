[project]
name = "daily-report"
version = "0.1.0"
description = "智能日报生成器：自动采集 GitHub 提交、飞书任务与群消息，生成并推送团队日报"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collector", "generator", "notifier", "shared"]
